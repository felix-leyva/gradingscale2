server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers are declared once at server level so every location
    # inherits them. Do not use add_header inside a location: nginx drops all
    # inherited headers as soon as a location declares its own.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Type always comes from the MIME table (/etc/nginx/mime.types is
    # included by the base image); add_header Content-Type produces a duplicated
    # header next to the one nginx already sends.

    # WASM: unhashed filenames (skiko.wasm), so revalidate instead of caching
    # for a year. application/wasm is restated for images whose mime.types
    # predates it; a types block in a location replaces the inherited table for
    # that location only.
    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
        expires -1;
    }

    # Unhashed entry scripts: composeApp.js, skiko.js, firebase-config.js.
    location ~ \.(?:js|mjs)$ {
        expires -1;
    }

    # Other unhashed text resources (style/config/manifests).
    location ~* \.(?:css|json|map|webmanifest|txt|xml)$ {
        expires -1;
    }

    # Binary media assets; filenames are still unhashed, so keep the TTL short.
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 7d;
    }

    # A missing static asset must be a 404, never index.html served with 200.
    # Only filename-like extensions count as assets: the extension must contain
    # at least one letter. An all-numeric trailing segment (/grade/2.5, /v1.2)
    # is a client route, so it falls through to the SPA shell below instead of
    # 404ing here. Unknown but word-like extensions (e.g. .asset) stay 404.
    location ~ \.[A-Za-z0-9]*[A-Za-z][A-Za-z0-9]*$ {
        try_files $uri =404;
    }

    # Shell document: must always be revalidated after a deploy.
    location = /index.html {
        expires -1;
    }

    # Client-side routes only; unknown paths without a file extension may fall
    # back to the SPA shell. Asset paths are handled by the locations above.
    # The shell must be revalidated (no-cache) on every client route too, so a
    # deploy is picked up immediately.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm;
}
